<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blast Damage Map Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }

    #controls { margin-bottom: 12px; }
    label { margin-right: 20px; }

    #wrap {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #plot { width: 900px; height: 900px; }

    #preview {
      width: 420px;
      position: sticky;
      top: 20px;
    }

    #previewTitle { font-weight: 700; margin-bottom: 10px; }

    #previewImg {
      width: 100%;
      height: auto;
      border: 1px solid rgba(0,0,0,0.2);
      background: #f7f7f7;
    }

    #previewMeta {
      margin-top: 10px;
      font-size: 13px;
      color: #333;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #areaPanel {
      margin-top: 18px;
      padding: 12px;
      border: 1px solid rgba(0,0,0,0.18);
      background: #f7f7f7;
    }

    #areaPanel strong { display: block; margin-bottom: 6px; }
    #areaHelp, #areaSummary { font-size: 13px; line-height: 1.45; }
    #areaSummary { margin-top: 8px; white-space: pre-line; }
    button { margin-left: 8px; }
  </style>
</head>
<body>

<h2>Spatially Averaged Blast Damage Map</h2>

<div id="controls">
  <label>
    TNT charge:
    <select id="charge"></select>
  </label>

  <label>
    Threshold:
    <input type="range" id="thr" min="0" max="1" step="0.01" value="0.50">
    <span id="thrVal">0.50</span>
  </label>

  <button id="clearArea" type="button" disabled>Clear selected area</button>
</div>

<div id="wrap">
  <div id="plot"></div>

  <div id="preview">
    <div id="previewTitle">Hover a grid cell to preview</div>
    <img id="previewImg" alt="snapshot preview" />
    <div id="previewMeta"></div>

    <div id="areaPanel">
      <strong>Area of interest</strong>
      <div id="areaHelp">Draw a rectangle on the map to focus the hazard assessment on an area of interest.</div>
      <div id="areaSummary">No area selected. The full hazard map is displayed.</div>
    </div>
  </div>
</div>

<script>
const chargeSel = document.getElementById("charge");
const thr = document.getElementById("thr");
const thrVal = document.getElementById("thrVal");
const plotDiv = document.getElementById("plot");
const clearAreaBtn = document.getElementById("clearArea");

const previewImg  = document.getElementById("previewImg");
const previewMeta = document.getElementById("previewMeta");
const areaSummary = document.getElementById("areaSummary");

let selectedArea = null;

// 축 범위 (cm)
const X_RANGE = [-5, 50];
const Y_RANGE = [5, 105];

// 스냅샷 폴더 (index.html 기준 상대경로)
const SNAP_DIR = "processed_damage_snapshots";

// charges 목록 (파이썬에서 자동 생성)
const files = ["m0p1", "m0p2", "m0p3", "m0p4", "m0p5", "m0p6", "m0p7", "m0p8", "m0p9", "m1p0"];

// populate dropdown
files.forEach(f => {
  const opt = document.createElement("option");
  opt.value = f;
  opt.text = f.replace("m","").replace("p",".") + " kg";
  chargeSel.appendChild(opt);
});

async function loadCSV(name) {
  const r = await fetch(`data/${name}.csv`);
  if (!r.ok) throw new Error(`Cannot load data/${name}.csv`);
  const text = await r.text();

  const rows = text.trim().split(/\r?\n/);
  const head = rows[0].split(",");
  const ix = head.indexOf("x_cm");
  const iy = head.indexOf("y_cm");
  const id = head.indexOf("damage");
  if (ix < 0 || iy < 0 || id < 0) {
    throw new Error("CSV must have columns: x_cm,y_cm,damage");
  }

  const data = rows.slice(1).map(r => r.split(",").map(Number));
  const xs = [...new Set(data.map(r => r[ix]))].sort((a,b)=>a-b);
  const ys = [...new Set(data.map(r => r[iy]))].sort((a,b)=>a-b);

  const z = ys.map(() => xs.map(() => null));
  data.forEach(r => {
    const x = r[ix], y = r[iy], d = r[id];
    if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(d)) {
      const yi2 = ys.indexOf(y);
      const xi2 = xs.indexOf(x);
      if (yi2 >= 0 && xi2 >= 0) z[yi2][xi2] = d;
    }
  });

  return {xs, ys, z};
}

function mask(z, t) {
  return z.map(row =>
    row.map(v => (v == null || Number.isNaN(v)) ? null : (v >= t ? 1 : 0))
  );
}

function normalizeArea(shape) {
  if (!shape) return null;
  const x0 = Number(shape.x0), x1 = Number(shape.x1);
  const y0 = Number(shape.y0), y1 = Number(shape.y1);
  if (![x0, x1, y0, y1].every(Number.isFinite) || x0 === x1 || y0 === y1) return null;
  return { x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1) };
}

function filterToArea(xs, ys, z, area) {
  if (!area) return z;
  return z.map((row, yi) => row.map((value, xi) =>
    xs[xi] >= area.x0 && xs[xi] <= area.x1 && ys[yi] >= area.y0 && ys[yi] <= area.y1 ? value : null
  ));
}

function updateAreaSummary(xs, ys, z, area, threshold) {
  if (!area) {
    areaSummary.textContent = "No area selected. The full hazard map is displayed.";
    clearAreaBtn.disabled = true;
    return;
  }

  const values = [];
  z.forEach((row, yi) => row.forEach((value, xi) => {
    if (value != null && xs[xi] >= area.x0 && xs[xi] <= area.x1 && ys[yi] >= area.y0 && ys[yi] <= area.y1) values.push(value);
  }));
  const exceed = values.filter(value => value >= threshold).length;
  const mean = values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : NaN;
  const maximum = values.length ? Math.max(...values) : NaN;
  const exceedPercent = values.length ? 100 * exceed / values.length : NaN;

  areaSummary.textContent =
    `Selected area: x = ${area.x0.toFixed(1)}--${area.x1.toFixed(1)} cm; y = ${area.y0.toFixed(1)}--${area.y1.toFixed(1)} cm\n` +
    `Grid cells: ${values.length}\n` +
    `Mean damage: ${Number.isFinite(mean) ? mean.toFixed(4) : "N/A"}\n` +
    `Maximum damage: ${Number.isFinite(maximum) ? maximum.toFixed(4) : "N/A"}\n` +
    `Damage >= ${threshold.toFixed(2)}: ${exceed}/${values.length} (${Number.isFinite(exceedPercent) ? exceedPercent.toFixed(1) : "N/A"}%)`;
  clearAreaBtn.disabled = false;
}

function pad3(n) {
  const s = String(n);
  return s.length >= 3 ? s : ("000" + s).slice(-3);
}

function buildSnapshotPath(chargeTag, x_cm, y_cm) {
  const xi = Math.round(Number(x_cm));
  const yi = Math.round(Number(y_cm));

  if (!Number.isFinite(xi) || !Number.isFinite(yi) || xi < 0 || yi < 0) return null;

  const xTag = pad3(xi);
  const yTag = pad3(yi);

  return `${SNAP_DIR}/damage_snapshot_${chargeTag}_x${xTag}_y${yTag}.png`;
}

function setPreview(chargeTag, x_cm, y_cm) {
  const p = buildSnapshotPath(chargeTag, x_cm, y_cm);
  if (!p) {
    previewImg.removeAttribute("src");
    previewMeta.textContent = `No preview (invalid coord): m=${chargeTag}, x=${x_cm}, y=${y_cm}`;
    return;
  }

  previewImg.src = `${p}?v=${Date.now()}`;
  previewMeta.textContent =
    `m=${chargeTag}\n` +
    `x=${Number(x_cm).toFixed(1)} cm, y=${Number(y_cm).toFixed(1)} cm\n` +
    `${p}`;
}

previewImg.onerror = () => {
  const txt = previewMeta.textContent || "";
  previewMeta.textContent = txt + "\n(Preview image not found)";
  previewImg.removeAttribute("src");
};

async function draw() {
  thrVal.textContent = Number(thr.value).toFixed(2);

  const charge = chargeSel.value;
  const {xs, ys, z} = await loadCSV(charge);
  const t = Number(thr.value);
  const focusedZ = filterToArea(xs, ys, z, selectedArea);
  const m = mask(focusedZ, t);
  updateAreaSummary(xs, ys, z, selectedArea, t);

  await Plotly.newPlot(plotDiv, [
    // base damage map (hover에서 d 표시)
    {
      type: "heatmap",
      x: xs,
      y: ys,
      z: focusedZ,
      colorscale: [
        [0.0, "rgb(255,255,255)"],
        [1.0, "rgb(0,0,0)"]
      ],
      zmin: 0,
      zmax: 1,
      colorbar: { title: "Damage" },
      hovertemplate:
        "x = %{x} cm<br>" +
        "y = %{y} cm<br>" +
        "d = %{z:.4f}<extra></extra>"
    },
    // overlay: threshold exceed = red, hover에서도 d 표시 (customdata 사용)
    {
      type: "heatmap",
      x: xs,
      y: ys,
      z: m,
      customdata: focusedZ,
      showscale: false,
      zmin: 0,
      zmax: 1,
      colorscale: [
        [0.0, "rgba(0,0,0,0)"],
        [1.0, "rgba(255,0,0,0.55)"]
      ],
      hovertemplate:
        "x = %{x} cm<br>" +
        "y = %{y} cm<br>" +
        "d = %{customdata:.4f}<extra></extra>"
    }
  ], {
    xaxis: {
      title: "X-coordinate (cm)",
      range: X_RANGE,
      tickmode: "linear",
      tick0: -5,
      dtick: 5,
      showgrid: true,
      gridcolor: "rgba(0,0,0,0.15)"
    },
    yaxis: {
      title: "Y-coordinate (cm)",
      range: Y_RANGE,
      tickmode: "linear",
      tick0: 5,
      dtick: 10,
      showgrid: true,
      gridcolor: "rgba(0,0,0,0.15)",
      scaleanchor: "x",
      scaleratio: 1
    },
    margin: { l: 80, r: 20, t: 20, b: 60 },
    dragmode: "drawrect",
    newshape: {
      line: { color: "#0072B2", width: 2 },
      fillcolor: "rgba(0,114,178,0.10)"
    },
    shapes: selectedArea ? [{
      type: "rect",
      xref: "x",
      yref: "y",
      x0: selectedArea.x0,
      x1: selectedArea.x1,
      y0: selectedArea.y0,
      y1: selectedArea.y1,
      line: { color: "#0072B2", width: 2 },
      fillcolor: "rgba(0,114,178,0.10)"
    }] : []
  }, {responsive: true});

  if (typeof plotDiv.removeAllListeners === "function") {
    plotDiv.removeAllListeners("plotly_hover");
    plotDiv.removeAllListeners("plotly_unhover");
    plotDiv.removeAllListeners("plotly_relayout");
  }

  plotDiv.on("plotly_hover", (ev) => {
    if (!ev || !ev.points || ev.points.length === 0) return;
    const pt = ev.points[0];
    setPreview(chargeSel.value, pt.x, pt.y);
  });

  plotDiv.on("plotly_unhover", () => {});

  plotDiv.on("plotly_relayout", (event) => {
    if (!event || !Object.keys(event).some(key => key.startsWith("shapes"))) return;
    const shapes = plotDiv.layout.shapes || [];
    const latestShape = shapes[shapes.length - 1];
    const area = normalizeArea(latestShape);
    if (!area) return;
    selectedArea = area;
    draw().catch(e => console.error(e));
  });
}

chargeSel.onchange = () => draw().catch(e => console.error(e));
thr.oninput = () => draw().catch(e => console.error(e));
clearAreaBtn.onclick = () => {
  selectedArea = null;
  draw().catch(e => console.error(e));
};

chargeSel.value = files[0] || "";
draw().catch(e => console.error(e));
</script>

</body>
</html>
